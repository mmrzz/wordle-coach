<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<style>
		.correct { fill: #6aaa64; }
		.present { fill: #c9b458; }
		.absent  { fill: #787c7e; }
		@media (prefers-color-scheme: dark) {
			.correct { fill: #538d4e; }
			.present { fill: #b59f3b; }
			.absent  { fill: #818384; }
		}
	</style>
	<rect class="correct" x="1"  y="1"  width="14" height="14" rx="2" />
	<rect class="absent"  x="17" y="1"  width="14" height="14" rx="2" />
	<rect class="present" x="1"  y="17" width="14" height="14" rx="2" />
	<rect class="correct" x="17" y="17" width="14" height="14" rx="2" />
</svg>
